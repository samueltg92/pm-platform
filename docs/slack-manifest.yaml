# Pegar en api.slack.com/apps → Create New App → From a manifest.
#
# Incluye los permisos y eventos de canales públicos Y privados. Los canales
# privados creados desde 2018 también tienen ID que empieza por C, así que no
# hay forma fiable de saber cuál es el tuyo mirando el ID: se piden los dos y
# se acabó el problema.
#
# Ajusta el dominio si cambias el de la app.
display_information:
  name: PM Platform
  description: Recordatorios y registro rápido del centro de control de producto
  background_color: "#1f5f4f"

features:
  bot_user:
    display_name: PM Platform
    always_online: false

oauth_config:
  scopes:
    bot:
      # Publicar los avisos y las respuestas en hilo
      - chat:write
      # Leer los mensajes del canal para poder clasificarlos.
      # channels:* es para canales públicos, groups:* para privados.
      - channels:history
      - groups:history

settings:
  event_subscriptions:
    request_url: https://stgpm.org/api/slack/eventos
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://stgpm.org/api/slack/interactivo
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
